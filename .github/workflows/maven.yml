name: Build the document and publish it to GitHub Pages

# Builds the document on every push and pull request. On a push to main, it also publishes
# target/site to GitHub Pages: the HTML as index.html and the PDF as <artifactId>-<version>.pdf.
# In the repository's Settings > Pages, set Source to "GitHub Actions".

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push does not cancel a deployment in progress
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build the document
      # Fails on a broken cross-reference, a missing include or attribute, or an invalid evaluation
      run: mvn -B clean package --file pom.xml
    - name: Keep the built document with the run
      uses: actions/upload-artifact@v4
      with:
        name: document
        path: target/site
    - name: Upload the site for GitHub Pages
      if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
